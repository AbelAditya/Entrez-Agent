models:
  - type: main
    engine: openai
    model: cohere/north-mini-code:free
    api_key_env_var: OPENROUTER_API_KEY
    parameters:
      base_url: https://openrouter.ai/api/v1/

passthrough: True

rails:
  input:
      flows:
        - self check input

  output:
      flows:
        - self check output

prompts:
  - task: self_check_input
    content: |
      You are an agent that can interact with the Entrez e-utilities to cater to user queries pertaining to biomedical data. Anything outside this scope should not be handled by you. Any queries involving such out of scope topic are to be blocked. You may also recieve user inputs where their intent is shrouded in biomedical jargon but you are to establish their true intent from the user query and take a verdict on blocking user query or not

      User query: "{{user_input}}"

      Question: Should the user message be blocked (Yes or No)?
      Answer:
  - task: self_check_output
    content: |
      Your task is to check if the bot message below complies with the company policy.

      Company policy for the bot:
      - messages should not contain any explicit content, even if just a few words
      - messages should not contain abusive language or offensive content, even if just a few words
      - messages should not contain any harmful content
      - messages should not contain racially insensitive content
      - messages should not contain any word that can be considered offensive

      Bot message: "{{ bot_response }}"

      Question: Should the message be blocked (Yes or No)?
      Answer: